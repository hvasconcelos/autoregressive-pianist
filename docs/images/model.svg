<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 501" width="800" height="501" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The transformer model, from token ids to next-token probabilities</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b7bd6"/></marker>
</defs>
<rect width="800" height="501" fill="#fff"/>
<rect x="90" y="92" width="412" height="262" rx="10" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="492" y="113" font-size="12.5" fill="#555" text-anchor="end" font-weight="600">× 6 layers</text>
<rect x="152" y="40" width="250" height="38" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="57" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Embedding</text>
<text x="277" y="71" font-size="11" fill="#555" text-anchor="middle">id → vector of 512 numbers</text>
<rect x="152" y="107" width="250" height="38" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="131" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Normalise</text>
<rect x="152" y="160" width="250" height="38" rx="6" fill="#eef3fa" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="177" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Attention</text>
<text x="277" y="191" font-size="11" fill="#555" text-anchor="middle">8 heads look back at earlier tokens</text>
<rect x="152" y="232" width="250" height="38" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="256" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Normalise</text>
<rect x="152" y="284" width="250" height="38" rx="6" fill="#eef3fa" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="301" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Feed-forward</text>
<text x="277" y="315" font-size="11" fill="#555" text-anchor="middle">512 → 2,048 → 512</text>
<rect x="152" y="372" width="250" height="38" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="396" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Normalise</text>
<rect x="152" y="425" width="250" height="38" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="442" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Output</text>
<text x="277" y="456" font-size="11" fill="#555" text-anchor="middle">compare with every embedding row</text>
<line x1="277" y1="24" x2="277" y2="39" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="78" x2="277" y2="106" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="145" x2="277" y2="159" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="221" x2="277" y2="231" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="270" x2="277" y2="283" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="345" x2="277" y2="371" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="410" x2="277" y2="424" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="463" x2="277" y2="477" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="277" y1="198" x2="277" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="277" y1="322" x2="277" y2="331" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="277" y="17" font-size="12.5" fill="#555" text-anchor="middle">token ids, e.g. 105 167 215 396</text>
<text x="277" y="493" font-size="12.5" fill="#555" text-anchor="middle">a probability for each of the 465 tokens</text>
<circle cx="277" cy="100" r="2.5" fill="#2b7bd6"/>
<polyline points="277,100 117,100 117,214 268,214" fill="none" stroke="#2b7bd6" stroke-width="1.5" marker-end="url(#ahb)"/>
<circle cx="277" cy="225" r="2.5" fill="#2b7bd6"/>
<polyline points="277,225 117,225 117,338 268,338" fill="none" stroke="#2b7bd6" stroke-width="1.5" marker-end="url(#ahb)"/>
<circle cx="277" cy="214" r="7" fill="#fff" stroke="#2b7bd6" stroke-width="1.5"/>
<path d="M273,214 h8 M277,210 v8" stroke="#2b7bd6" stroke-width="1.5"/>
<circle cx="277" cy="338" r="7" fill="#fff" stroke="#2b7bd6" stroke-width="1.5"/>
<path d="M273,338 h8 M277,334 v8" stroke="#2b7bd6" stroke-width="1.5"/>
<text x="82" y="215" font-size="11.5" fill="#2b7bd6" text-anchor="end">add the</text>
<text x="82" y="229" font-size="11.5" fill="#2b7bd6" text-anchor="end">input back</text>
<text x="515" y="63" font-size="11.5" fill="#555" text-anchor="start">A learned table, 465 rows.</text>
<text x="515" y="175.5" font-size="11.5" fill="#555" text-anchor="start">Each position asks a question of all earlier ones</text>
<text x="515" y="190.5" font-size="11.5" fill="#555" text-anchor="start">and blends in the answers.</text>
<text x="515" y="299.5" font-size="11.5" fill="#555" text-anchor="start">A small network applied to each position.</text>
<text x="515" y="314.5" font-size="11.5" fill="#555" text-anchor="start">Most of the parameters are here.</text>
<text x="515" y="448" font-size="11.5" fill="#555" text-anchor="start">Reuses the embedding table (weight tying).</text>
</svg>
