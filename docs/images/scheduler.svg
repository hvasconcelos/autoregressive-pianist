<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 145" width="800" height="145" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The real-time scheduler: the clock follows behind the generation head</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b7bd6"/></marker>
</defs>
<rect width="800" height="145" fill="#fff"/>
<rect x="62" y="60" width="50" height="12" rx="3" fill="#cdc9c2"/>
<rect x="125" y="60" width="32" height="12" rx="3" fill="#cdc9c2"/>
<rect x="169" y="60" width="74" height="12" rx="3" fill="#cdc9c2"/>
<rect x="256" y="60" width="37" height="12" rx="3" fill="#cdc9c2"/>
<rect x="327" y="60" width="43" height="12" rx="3" fill="#2b7bd6"/>
<rect x="380" y="60" width="25" height="12" rx="3" fill="#2b7bd6"/>
<rect x="412" y="60" width="88" height="12" rx="3" fill="#2b7bd6"/>
<rect x="512" y="60" width="33" height="12" rx="3" fill="#2b7bd6"/>
<rect x="555" y="60" width="27" height="12" rx="3" fill="#2b7bd6"/>
<line x1="37" y1="88" x2="763" y2="88" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="312" y1="28" x2="312" y2="125" stroke="#e8643a" stroke-width="2"/>
<line x1="587" y1="28" x2="587" y2="125" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="312" y="20" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">now (wall clock)</text>
<text x="587" y="20" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">head</text>
<text x="175" y="50" font-size="11.5" fill="#555" text-anchor="middle">already sent to the instrument</text>
<text x="450" y="50" font-size="11.5" fill="#2b7bd6" text-anchor="middle">generated, waiting in the buffer</text>
<text x="600" y="71" font-size="11.5" fill="#555" text-anchor="start">the model adds notes here</text>
<text x="762" y="108" font-size="11.5" fill="#555" text-anchor="end">music time</text>
<line x1="315" y1="117" x2="584" y2="117" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="449.5" y="137" font-size="11.5" fill="#1a1a1a" text-anchor="middle">lookahead, about 1 s</text>
</svg>
